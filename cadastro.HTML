<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro - Instituto Futuro Verde</title>
</head>
<body>

    <header>
        <h1>Instituto Futuro Verde</h1>
        <nav>
            <a href="index.html">Início</a> | 
            <a href="projetos.html">Projetos Sociais</a> | 
            <a href="cadastro.html">Cadastro</a>
        </nav>
    </header>

    <main>
        <h2>Cadastro de Apoiadores</h2>

        <form>
            <fieldset>
                <legend>Dados Pessoais</legend>
                
                <label for="nome">Nome Completo:</label><br>
                <input type="text" id="nome" name="nome" required><br><br>

                <label for="nascimento">Data de Nascimento:</label><br>
                <input type="date" id="nascimento" name="nascimento" required><br><br>

                <label for="cpf">CPF:</label><br>
                <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required><br><br>
            </fieldset>

            <fieldset>
                <legend>Endereço</legend>

                <label for="endereco">Endereço Completo:</label><br>
                <input type="text" id="endereco" name="endereco" required><br><br>
            </fieldset>

            <br>
            <button type="submit">Enviar Cadastro</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Instituto Futuro Verde. Todos os direitos reservados.</p>
    </footer>

</body>
</html>
